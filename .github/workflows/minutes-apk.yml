name: 議事録ビューア APK

on:
  push:
    paths:
      - "minutes/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/minutes-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test & build
        run: |
          chmod +x gradlew
          ./gradlew :minutes:testDebugUnitTest :minutes:assembleDebug --stacktrace
      - name: Rename APK
        run: cp minutes/build/outputs/apk/debug/minutes-debug.apk minutes-reader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: minutes-reader-apk
          path: minutes-reader.apk
          retention-days: 30
